# Coturn STUN/TURN server configuration for BeamDesk
listening-port=3478
tls-listening-port=5349

# IP & Realm configuration
realm=beamdesk.local
server-name=beamdesk-turn

# Credentials
fingerprint
lt-cred-mech
user=beamdeskuser:beamdeskpassword

# Ports for relayed traffic
min-port=49152
max-port=65535

# Logging
verbose
no-stdout-log
log-file=/var/log/coturn.log
